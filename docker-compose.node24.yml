name: knowledge-source-node24

x-source-environment: &source-environment
  ENTRYPOINT_COMPOSE_PROJECT: source
  ENTRYPOINT_LOCAL_ENV: /run/project-config/.env.local
  NODE_ENV:
  ENV_FILE:
  SSM_PATH:
  SECRETS_ARN:
  SECRET_JSON:
  VAULT_SECRET_PATH:
  VAULT_ADDR:
  VAULT_TOKEN:
  VAULT_NAMESPACE:
  VAULT_KV_VERSION:
  AWS_REGION:
  AWS_DEFAULT_REGION:
  AWS_ACCESS_KEY_ID:
  AWS_SECRET_ACCESS_KEY:
  AWS_SESSION_TOKEN:
  AWS_PROFILE:
  AWS_SHARED_CREDENTIALS_FILE:
  AWS_CONFIG_FILE:
  AWS_ROLE_ARN:
  AWS_WEB_IDENTITY_TOKEN_FILE:
  AWS_CONTAINER_CREDENTIALS_RELATIVE_URI:
  AWS_CONTAINER_CREDENTIALS_FULL_URI:
  AWS_CONTAINER_AUTHORIZATION_TOKEN:
  AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE:
  ENTRYPOINT_TIMEOUT_MS:
  PGHOST:
  PGPORT:
  PGDATABASE:
  PGUSER:
  PGPASSWORD:
  PGSSLMODE:
  SOURCE_PGHOST:
  SOURCE_PGPORT:
  SOURCE_PGDATABASE:
  SOURCE_PGUSER:
  SOURCE_PGPASSWORD:
  SOURCE_REDIS_URL:
  REDIS_URL:
  ENABLE_TENANT:
  ENABLE_K12:
  DEFAULT_KNOWLEDGE:
  KNOWLEDGE_SOURCE_STORAGE_ROOT:

x-app-image: &app-image
  image: question-generation/knowledge-source-service:node24

services:
  source-db:
    image: question-generation/knowledge-source-postgres:node24
    build:
      context: .
      dockerfile: Dockerfile.postgres-node24
    environment:
      ENTRYPOINT_COMPOSE_PROJECT: source-db
      ENTRYPOINT_LOCAL_ENV: /run/project-config/.env.local
      ENV_FILE:
      PGDATABASE:
      PGUSER:
      PGPASSWORD:
      SOURCE_PGDATABASE:
      SOURCE_PGUSER:
      SOURCE_PGPASSWORD:
    volumes:
      - .:/run/project-config:ro
      - source-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "node", "/opt/source-runtime/postgres-healthcheck.mjs"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  source-redis:
    image: redis:8.2.1-bookworm@sha256:5fa2edb1e408fa8235e6db8fab01d1afaaae96c9403ba67b70feceb8661e8621
    profiles: [cache]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  source-migrate:
    <<: *app-image
    pull_policy: never
    environment: *source-environment
    command: ["node", "scripts/db/migrate.mjs"]
    depends_on:
      source-db:
        condition: service_healthy
    init: true
    restart: "no"
    volumes:
      - .:/run/project-config:ro

  source-seed:
    <<: *app-image
    pull_policy: never
    environment: *source-environment
    command: ["node", "scripts/source-collections/seed-source-collections.mjs"]
    depends_on:
      source-migrate:
        condition: service_completed_successfully
    volumes:
      - .:/run/project-config:ro
      - source-artifact-data:/app/storage/knowledge
    init: true
    restart: "no"

  knowledge-source-service:
    <<: *app-image
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.node24
    environment: *source-environment
    depends_on:
      source-db:
        condition: service_healthy
      source-seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${SOURCE_PORT:-3200}:3200"
    volumes:
      - .:/run/project-config:ro
      - source-artifact-data:/app/storage/knowledge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/readyz').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      options:
        max-size: 10m
        max-file: "3"

  source-test:
    image: question-generation/knowledge-source-service:node24-test
    profiles: [tools]
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.node24
      target: builder
    environment: *source-environment
    command: ["npm", "test"]
    depends_on:
      source-migrate:
        condition: service_completed_successfully
    init: true
    restart: "no"
    volumes:
      - .:/run/project-config:ro

  source-readiness:
    <<: *app-image
    pull_policy: never
    profiles: [tools]
    depends_on:
      knowledge-source-service:
        condition: service_healthy
    command:
      - node
      - -e
      - |
        const base = 'http://knowledge-source-service:3200';
        Promise.all(['/healthz', '/readyz', '/openapi.json', '/v1/source-collections'].map(async (path) => {
          const response = await fetch(base + path);
          if (!response.ok) throw new Error(path + ' returned ' + response.status);
          return [path, response.status];
        })).then((checks) => console.log(JSON.stringify(Object.fromEntries(checks)))).catch((error) => {
          console.error(error.message);
          process.exit(1);
        });
    init: true
    restart: "no"

volumes:
  source-db-data:
  source-artifact-data:
